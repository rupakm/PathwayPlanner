[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathwayplanner"
version = "0.1.0"
description = "A planning language for controlled molecular dynamics: structural actions, recipes, and an action compiler over MD backends"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Rupak Majumdar" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
trailsmd = ["trails-md>=1.1"]
pathgennie = ["pathgennie>=2.0"]
dev = ["pytest>=7", "ruff"]

[tool.setuptools.packages.find]
include = ["pathwayplanner*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
